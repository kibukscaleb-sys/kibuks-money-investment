<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="HUT 10 PRO account access">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260929">
<title>Login / Register • HUT 10 PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260926-auth2">
<style>
:root{
  --auth-text:#f7f8ff;
  --auth-muted:#7d88a4;
  --auth-line:rgba(143,162,202,.13);
  --auth-blue:#718cff;
  --auth-purple:#9a67ff;
}
body{
  min-height:100vh;
  margin:0;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% -8%,rgba(111,140,255,.22),transparent 28%),
    radial-gradient(circle at 8% 72%,rgba(64,217,255,.08),transparent 22%),
    radial-gradient(circle at 92% 30%,rgba(154,103,255,.10),transparent 22%),
    #04060c;
  color:var(--auth-text);
}
.auth-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:28px 18px;
  position:relative;
  z-index:3;
}
.auth-wrap:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(124,145,186,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,145,186,.035) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:linear-gradient(to bottom,transparent,rgba(0,0,0,.8) 28%,#000 75%,transparent);
  transform:perspective(900px) rotateX(58deg) scale(1.35) translateY(18%);
  transform-origin:center bottom;
  opacity:.55;
}
.auth-box{
  width:min(470px,100%);
  position:relative;
  padding:34px;
  border:1px solid rgba(135,157,203,.16);
  border-radius:26px;
  background:
    radial-gradient(circle at 50% 0%,rgba(111,140,255,.08),transparent 30%),
    linear-gradient(145deg,rgba(12,17,31,.93),rgba(5,8,15,.90));
  backdrop-filter:blur(24px);
  box-shadow:
    0 35px 100px rgba(0,0,0,.46),
    0 0 0 1px rgba(255,255,255,.02) inset,
    0 0 55px rgba(111,140,255,.06);
}
.auth-box:before{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:25px;
  pointer-events:none;
  background:linear-gradient(125deg,rgba(255,255,255,.05),transparent 25%,transparent 72%,rgba(111,140,255,.06));
}
.auth-brand{
  position:relative;
  text-align:center;
  margin-bottom:24px;
}
.auth-mark{
  width:66px;height:66px;
  margin:0 auto 14px;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#202b59,#718cff 62%,#9a67ff);
  border:1px solid rgba(180,194,255,.18);
  font:800 17px Sora;
  letter-spacing:-1px;
  color:#fff;
  box-shadow:
    0 0 35px rgba(111,140,255,.28),
    0 12px 35px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.2);
}
.auth-brand h1{
  margin:0;
  font:800 23px Sora;
  letter-spacing:-.8px;
}
.auth-brand p{
  margin:7px 0 0;
  color:#7280a0;
  font-size:9px;
  letter-spacing:1.8px;
  font-weight:800;
}
.tabs{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:4px;
  border:1px solid var(--auth-line);
  border-radius:14px;
  background:rgba(255,255,255,.025);
  margin-bottom:21px;
}
.tabs button{
  border:0;
  background:transparent;
  color:#6e7892;
  padding:11px 8px;
  border-radius:10px;
  font:800 9px Manrope;
  letter-spacing:.5px;
  cursor:pointer;
  transition:.2s ease;
}
.tabs button:hover{color:#bfc8df}
.tabs button.active{
  color:#f5f7ff;
  background:linear-gradient(135deg,rgba(111,140,255,.18),rgba(154,103,255,.10));
  box-shadow:
    inset 0 0 0 1px rgba(111,140,255,.12),
    0 7px 20px rgba(0,0,0,.16);
}
.auth-form{display:grid;gap:14px;position:relative}
.auth-form label{
  display:grid;
  gap:7px;
  color:#77839f;
  font-size:8px;
  font-weight:800;
  letter-spacing:1px;
}
.auth-form input{
  box-sizing:border-box;
  width:100%;
  min-height:46px;
  padding:12px 14px;
  border:1px solid rgba(129,149,190,.13);
  border-radius:12px;
  background:rgba(255,255,255,.035);
  color:#f4f7ff;
  outline:none;
  font:500 11px Manrope;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.018);
  transition:.2s ease;
}
.auth-form input::placeholder{color:#505b74}
.auth-form input:hover{
  border-color:rgba(111,140,255,.24);
  background:rgba(255,255,255,.045);
}
.auth-form input:focus{
  border-color:rgba(111,140,255,.62);
  background:rgba(111,140,255,.055);
  box-shadow:0 0 0 3px rgba(111,140,255,.08),0 0 24px rgba(111,140,255,.06);
}
.auth-submit{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:12px;
  padding:13px 14px;
  margin-top:4px;
  background:linear-gradient(135deg,#708cff 0%,#836fff 52%,#9a67ff 100%);
  color:#fff;
  font:800 10px Manrope;
  letter-spacing:.25px;
  cursor:pointer;
  box-shadow:0 14px 30px rgba(111,140,255,.22);
  transition:.2s ease;
}
.auth-submit:hover{
  transform:translateY(-1px);
  box-shadow:0 18px 38px rgba(111,140,255,.3);
}
.auth-note{
  position:relative;
  text-align:center;
  color:#5f6a82;
  font-size:8px;
  line-height:1.65;
  margin:16px 4px 0;
}
.back{
  position:relative;
  text-align:center;
  margin-top:18px;
}
.back a{
  color:#8fa4ff;
  text-decoration:none;
  font-size:9px;
  font-weight:800;
}
.back a:hover{color:#c3ccff}
.hidden{display:none!important}
@media(max-width:520px){
  .auth-wrap{padding:16px 12px}
  .auth-box{padding:25px 18px;border-radius:22px}
  .auth-brand h1{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
  .auth-submit,.tabs button,.auth-form input{transition:none}
}
 .auth-message{min-height:16px;text-align:center;font-size:8.5px;line-height:1.5;margin-top:7px;color:#6f7b94}.auth-message.error{color:#ff9aaa}.auth-message.success{color:#6fe3bd}.auth-state{text-align:center;margin-top:13px}.auth-state span{display:inline-flex;padding:5px 7px;border-radius:7px;border:1px solid rgba(111,140,255,.12);background:rgba(111,140,255,.05);color:#7180a3;font-size:6.5px;letter-spacing:1.2px;font-weight:800}.auth-state span.signed{color:#69e0bc;border-color:rgba(58,216,164,.14);background:rgba(58,216,164,.06)}.auth-submit:disabled{opacity:.65;cursor:wait;transform:none!important}.forgot-link{border:0;background:none;padding:0;margin-top:-2px;text-align:right;color:#8ea2ff;font:700 8px Manrope;cursor:pointer}.forgot-link:hover{color:#c3ccff}</style>
</head>
<body>
<div class="ai-atmosphere" aria-hidden="true"><div class="video-horizon"></div><div class="ai-grid"></div><div class="ai-orbit orbit-a"></div><div class="ai-orbit orbit-b"></div><div class="ai-orbit orbit-c"></div><div class="ai-light light-a"></div><div class="ai-light light-b"></div><div class="ai-light light-c"></div><div class="ai-particle p1"></div><div class="ai-particle p2"></div><div class="ai-particle p3"></div><div class="ai-particle p4"></div><div class="ai-particle p5"></div><div class="ai-particle p6"></div></div>
<main class="auth-wrap"><section class="auth-box">
<div class="auth-brand"><div class="auth-mark">H10</div><h1>HUT 10 PRO</h1><p>SECURE ACCOUNT ACCESS</p></div>
<div class="tabs"><button id="loginTab" class="active" onclick="switchMode('login')">LOGIN</button><button id="registerTab" onclick="switchMode('register')">CREATE ACCOUNT</button></div>
<form class="auth-form" onsubmit="handleAuth(event)">
<label id="nameField" class="hidden">FULL NAME<input id="fullName" type="text" placeholder="Your full name"></label>
<label>EMAIL ADDRESS<input id="email" type="email" placeholder="you@example.com" required></label>
<label>PHONE NUMBER<input id="phone" type="tel" placeholder="+256 ..." ></label>
<label>PASSWORD<input id="password" type="password" placeholder="Enter password" required minlength="6"><button type="button" class="forgot-link" onclick="resetPassword()">Forgot password? (email reset)</button></label>
<label id="confirmField" class="hidden">CONFIRM PASSWORD<input id="confirm" type="password" placeholder="Repeat password"></label>
<button class="auth-submit" id="submitBtn">Login to HUT 10 PRO →</button>
<div id="authMessage" class="auth-message" role="status" aria-live="polite"></div>
<div class="auth-state"><span id="authState">SECURE AUTH</span></div>
</form>
<p class="auth-note">This is the account interface. Authentication is powered by your HUT 10 PRO Supabase account connection.</p>
<div class="back"><a href="index.html">← Back to dashboard</a></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260926-live2"></script>
<script>
let mode='login';
let supabaseClient=null;

const $=id=>document.getElementById(id);

function configured(){
  const cfg=window.HUT10_SUPABASE_CONFIG;
  return cfg && cfg.url && cfg.key &&
    !cfg.url.includes('PASTE_YOUR_') &&
    !cfg.key.includes('PASTE_YOUR_');
}

function initAuth(){
  if(configured()){
    supabaseClient=window.supabase.createClient(
      window.HUT10_SUPABASE_CONFIG.url,
      window.HUT10_SUPABASE_CONFIG.key,
      {auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}}
    );
    supabaseClient.auth.getSession().then(({data})=>{
      if(data.session){
        $('authState').textContent='SIGNED IN';
        $('authState').classList.add('signed');
      }
    });
  }
}

function switchMode(m){
  mode=m;
  $('loginTab').classList.toggle('active',m==='login');
  $('registerTab').classList.toggle('active',m==='register');
  $('nameField').classList.toggle('hidden',m!=='register');
  $('confirmField').classList.toggle('hidden',m!=='register');
  $('submitBtn').textContent=m==='login'?'Login to HUT 10 PRO →':'Create HUT 10 PRO Account →';
  $('fullName').required=m==='register';
  $('confirm').required=m==='register';
  $('authMessage').textContent='';
  $('authMessage').className='auth-message';
}

async function resetPassword(){
  const email=$('email').value.trim();
  if(!email){setMessage('Enter your email address first, then choose Forgot password.','error');return;}
  if(!configured()){setMessage('Supabase is not connected.','error');return;}
  try{
    const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{
      redirectTo:window.location.origin+window.location.pathname.replace('auth.html','update-password.html')
    });
    if(error) throw error;
    setMessage('Password reset instructions have been sent to your email.','success');
  }catch(error){
    setMessage(error?.message||'Unable to send password reset email.','error');
  }
}

function setMessage(message,type=''){
  const el=$('authMessage');
  el.textContent=message;
  el.className='auth-message '+type;
}

async function handleAuth(e){
  e.preventDefault();
  const email=$('email').value.trim();
  const phone=$('phone').value.trim();
  const password=$('password').value;

  if(!configured()){
    setMessage('Supabase is not connected yet. Add your Project URL and publishable key in supabase-config.js.','error');
    return;
  }

  $('submitBtn').disabled=true;
  $('submitBtn').textContent=mode==='login'?'Signing in…':'Creating account…';
  setMessage('');

  try{
    if(mode==='register'){
      const name=$('fullName').value.trim();
      const confirm=$('confirm').value;
      if(!name){setMessage('Please enter your full name.','error');return;}
      if(password.length<6){setMessage('Password must be at least 6 characters.','error');return;}
      if(password!==confirm){setMessage('Passwords do not match.','error');return;}

      const {data,error}=await supabaseClient.auth.signUp({
        email,
        password,
        options:{
          emailRedirectTo:window.location.origin+window.location.pathname,
          data:{full_name:name,phone}
        }
      });
      if(error) throw error;

      localStorage.setItem('hut10_name',name);
      localStorage.setItem('hut10_username',name.toLowerCase().replace(/\s+/g,'.'));
      localStorage.setItem('hut10_email',email);
      if(phone)localStorage.setItem('hut10_phone',phone);

      if(data.session){
        setMessage('Account created. Opening your profile…','success');
        window.location.href='profile.html';
      }else{
        setMessage('Account created. Check your email to confirm your account, then return to log in.','success');
      }
    }else{
      if(!email){setMessage('Please enter your email address.','error');return;}
      const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error){
        const msg=String(error.message||'');
        if(/rate limit|rate_limit|too many/i.test(msg)){
          setMessage('Supabase is temporarily rate-limiting this account. Do not request another email; use the existing password or wait for the limit to reset.','error');
          return;
        }
        throw error;
      }

      localStorage.setItem('hut10_email',email);
      localStorage.setItem('hut10_session','active');
      setMessage('Login successful. Opening HUT 10 PRO…','success');
      window.location.href='index.html';
    }
  }catch(error){
    setMessage(error?.message||'Authentication failed. Please try again.','error');
  }finally{
    $('submitBtn').disabled=false;
    $('submitBtn').textContent=mode==='login'?'Login to HUT 10 PRO →':'Create HUT 10 PRO Account →';
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  initAuth();
  switchMode('login');
});
</script>
</body></html>
