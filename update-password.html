<style>
.reset-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;z-index:2}.reset-box{width:min(440px,100%);padding:32px;border:1px solid rgba(135,157,203,.15);border-radius:24px;background:linear-gradient(145deg,rgba(12,17,31,.94),rgba(5,8,15,.90));box-shadow:0 35px 90px rgba(0,0,0,.42);backdrop-filter:blur(22px)}.reset-brand{text-align:center;margin-bottom:22px}.reset-mark{width:60px;height:60px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#202b59,#718cff 62%,#9a67ff);font:800 16px Sora;color:#fff;box-shadow:0 0 32px rgba(111,140,255,.25)}.reset-brand h1{margin:0;font:800 22px Sora}.reset-brand p{margin:7px 0 0;color:#7582a3;font-size:8px;letter-spacing:1.4px;font-weight:800}.reset-box h2{font:800 18px Sora;margin:0 0 7px}.reset-box>p{color:#727e97;font-size:9px;line-height:1.7;margin:0 0 18px}.reset-box label{display:grid;gap:7px;color:#77839f;font-size:8px;font-weight:800;letter-spacing:.8px}.reset-box input{box-sizing:border-box;width:100%;padding:13px;border:1px solid rgba(143,162,202,.12);border-radius:11px;background:rgba(255,255,255,.035);color:#edf1ff;outline:none;font:500 10px Manrope;margin-bottom:12px}.reset-box input:focus{border-color:rgba(111,140,255,.58);box-shadow:0 0 0 3px rgba(111,140,255,.08)}.reset-btn{width:100%;border:0;border-radius:11px;padding:13px;background:linear-gradient(135deg,#708cff,#9a67ff);color:#fff;font:800 9px Manrope;cursor:pointer}.reset-msg{text-align:center;min-height:17px;margin-top:10px;font-size:8px;color:#6fe3bd}.reset-back{text-align:center;margin-top:16px}.reset-back a{color:#91a3ff;text-decoration:none;font-size:8.5px;font-weight:800}
</style>
</head>
<body>
<div class="ai-atmosphere" aria-hidden="true"><div class="video-horizon"></div><div class="ai-grid"></div><div class="ai-orbit orbit-a"></div><div class="ai-orbit orbit-b"></div><div class="ai-orbit orbit-c"></div><div class="ai-light light-a"></div><div class="ai-light light-b"></div><div class="ai-light light-c"></div><div class="ai-particle p1"></div><div class="ai-particle p2"></div><div class="ai-particle p3"></div><div class="ai-particle p4"></div><div class="ai-particle p5"></div><div class="ai-particle p6"></div></div>
<main class="reset-wrap"><section class="reset-box">
<div class="reset-brand"><div class="reset-mark">H10</div><h1>HUT 10 PRO</h1><p>SECURE PASSWORD RECOVERY</p></div>
<h2>Set a new password</h2><p>Enter a new password for your authenticated HUT 10 PRO account.</p>
<form id="resetForm">
<label>NEW PASSWORD<input id="newPassword" type="password" minlength="6" required placeholder="At least 6 characters"></label>
<label>CONFIRM PASSWORD<input id="confirmPassword" type="password" minlength="6" required placeholder="Repeat password"></label>
<button class="reset-btn" type="submit">Update password →</button>
</form>
<div id="msg" class="reset-msg"></div>
<div class="reset-back"><a href="auth.html">← Back to Login</a></div>
</section></main>
<script>
const cfg=window.HUT10_SUPABASE_CONFIG;
const client=(cfg&&cfg.url&&cfg.key)?window.supabase.createClient(cfg.url,cfg.key,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}}):null;
const msg=document.getElementById('msg');
if(!client){
 msg.textContent='Supabase configuration is unavailable.';
}else{
 client.auth.onAuthStateChange((event,session)=>{
   if(event==='PASSWORD_RECOVERY' || session){
     msg.textContent='Recovery session detected. Enter your new password.';
   }
 });
 client.auth.getSession().then(({data})=>{
   if(!data.session && !window.location.hash && !new URLSearchParams(location.search).get('code')){
     msg.textContent='Open the password-reset link from your email to continue.';
   }
 });
}
document.getElementById('resetForm').addEventListener('submit',async(e)=>{
 e.preventDefault();
 const p=document.getElementById('newPassword').value;
 const c=document.getElementById('confirmPassword').value;
 if(p.length<6){msg.textContent='Password must be at least 6 characters.';return}
 if(p!==c){msg.textContent='Passwords do not match.';return}
 if(!client){msg.textContent='Supabase is not configured.';return}
 const {data:{session}}=await client.auth.getSession();
 if(!session){msg.textContent='Your reset link is missing or expired. Request a new reset link.';return}
 const {error}=await client.auth.updateUser({password:p});
 if(error){msg.textContent=error.message;return}
 msg.textContent='Password updated successfully. Redirecting to login…';
 setTimeout(()=>location.href='auth.html',900);
});
</script>
</body></html>
